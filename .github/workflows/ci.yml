name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-targets --quiet
      - name: doc
        run: cargo doc --no-deps --quiet
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: cargo-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces CVEs / unmaintained crates without blocking the
    # workflow. Known acceptable advisories are filtered via deny.toml's
    # `[advisories] ignore` list (cargo-audit reads the same field).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo install cargo-audit --locked --quiet
      - run: cargo audit --ignore RUSTSEC-2024-0436

  deny:
    name: cargo-deny (licenses + bans + sources)
    runs-on: ubuntu-latest
    # Blocking: deny.toml is under our control, so any failure here is a
    # policy violation we want surfaced as a hard stop, not an advisory.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo install cargo-deny --locked --quiet
      - run: cargo deny check
