name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege: every job only reads the repo. No job publishes, comments,
# or touches secrets, so the workflow never needs write scopes on GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-targets --quiet
      - name: doc
        run: cargo doc --no-deps --quiet
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: cargo-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces CVEs / unmaintained crates without blocking the
    # workflow. Acceptable advisories are passed explicitly via --ignore here
    # and mirrored (with rationale) in deny.toml's `[advisories] ignore` list,
    # which the blocking `deny` job below enforces.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo install cargo-audit --locked --quiet
      # RUSTSEC-2024-0436: paste unmaintained (via rmcp). RUSTSEC-2026-0189:
      # rmcp Streamable-HTTP DNS rebinding — not reachable; we serve stdio only.
      - run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0189

  deny:
    name: cargo-deny (licenses + bans + sources)
    runs-on: ubuntu-latest
    # Blocking: deny.toml is under our control, so any failure here is a
    # policy violation we want surfaced as a hard stop, not an advisory.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo install cargo-deny --locked --quiet
      - run: cargo deny check
