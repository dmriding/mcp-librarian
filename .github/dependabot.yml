version: 2
updates:
  # Keep GitHub Actions current. Dependabot can also be configured to pin to
  # commit SHAs; we keep the readable tag refs and let it open PRs on updates.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep Cargo dependencies current and surface new advisories off-PR, so a
  # freshly-published RUSTSEC entry shows up as a Dependabot PR rather than
  # only as a red `cargo deny` run on the next unrelated push.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
